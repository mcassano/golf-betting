<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HP LaserJet Pro M404n</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            green: {
              850: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <nav id="nav" class="hidden bg-green-800 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">⛳</span>
        <span id="nav-tournament-name" class="font-semibold text-lg">Golf Betting</span>
      </div>
      <div class="flex items-center gap-1 text-sm" id="nav-links"></div>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-green-200">Signed in as <strong id="nav-user" class="text-white"></strong></span>
        <button onclick="logout()" class="text-green-200 hover:text-white underline">Sign out</button>
      </div>
    </div>
  </nav>
  <main id="app" class="max-w-5xl mx-auto px-4 py-6"></main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
